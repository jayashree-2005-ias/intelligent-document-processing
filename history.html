<!DOCTYPE html>
<html>
<head>

    <title>Document History</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #2874a6;
            color: white;
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

    </style>

</head>

<body>

    <h1>Document History</h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Filename</th>
            <th>File Type</th>
            <th>Extracted Text</th>
        </tr>

        {% for document in documents %}

        <tr>

            <td>{{ document[0] }}</td>

            <td>{{ document[1] }}</td>

            <td>{{ document[2] }}</td>

            <td>
                <pre>{{ document[3] }}</pre>
            </td>

        </tr>

        {% else %}

        <tr>
            <td colspan="4">No documents found</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">Upload Another Document</a>

</body>
</html>
